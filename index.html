<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MacStudy v1.3</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #888;
            --window-bg: #ffffff;
            --border-color: #000000;
        }
        
        * { box-sizing: border-box; }

        body {
            font-family: 'VT323', monospace;
            background-color: var(--bg-color);
            margin: 0; padding: 0;
            display: flex; justify-content: center; align-items: center;
            height: 100dvh; overflow: hidden; 
            background-image: 
                linear-gradient(45deg, #aaa 25%, transparent 25%), 
                linear-gradient(-45deg, #aaa 25%, transparent 25%), 
                linear-gradient(45deg, transparent 75%, #aaa 75%), 
                linear-gradient(-45deg, transparent 75%, #aaa 75%);
            background-size: 2px 2px;
            user-select: none;
        }

        /* --- RETRO MAC WINDOW STRUCTURE --- */
        #main-window {
            width: 95%; max-width: 900px; height: 90vh;
            background: var(--window-bg);
            border: 2px solid var(--border-color);
            border-radius: 4px;
            box-shadow: 5px 5px 0px rgba(0,0,0,0.3);
            display: flex; flex-direction: column; position: relative;
        }

        /* TITLE BAR */
        #title-bar {
            background: repeating-linear-gradient(to bottom, #000, #000 1px, #fff 1px, #fff 2px);
            height: 24px; border-bottom: 2px solid var(--border-color);
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0; position: relative;
        }

        #title-text { background: #fff; padding: 0 10px; font-size: 18px; font-weight: bold; text-transform: uppercase; }
        
        #close-btn {
            position: absolute; left: 6px; width: 12px; height: 12px;
            border: 1px solid #000; background: #fff; box-shadow: 1px 1px 0 #000; cursor: pointer;
        }

        /* MENU BAR */
        #menu-bar {
            border-bottom: 2px solid #000; padding: 2px 5px; font-size: 20px;
            display: flex; gap: 15px; background: #fff;
        }
        .menu-item { cursor: pointer; padding: 0 5px; }
        .menu-item:hover { background: #000; color: #fff; }

        /* CONTENT AREA */
        #content {
            flex: 1; padding: 20px; overflow: hidden;
            display: flex; flex-direction: column; align-items: center; position: relative;
        }

        .screen {
            display: none; width: 100%; flex: 1; min-height: 0;
            flex-direction: column; align-items: center;
        }
        .screen.active { display: flex; }

        h1 { font-size: 48px; margin: 10px 0 20px 0; text-align: center; letter-spacing: 2px; text-shadow: 2px 2px 0 #ccc; }
        h2 { font-size: 28px; margin: 10px 0; text-align: center; text-decoration: underline; }

        /* MENU GRID FOR BUTTONS */
        .menu-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px;
        }

        .btn {
            background: #fff; border: 2px solid #000; padding: 10px 10px; 
            font-family: 'VT323', monospace; font-size: 24px; cursor: pointer;
            box-shadow: 3px 3px 0 #000; transition: transform 0.1s, box-shadow 0.1s;
            width: 200px; text-align: center;
        }
        .btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #000; }
        .btn:hover { background: #eee; }
        .btn:disabled { opacity: 0.3; cursor: not-allowed; border-style: dashed; }

        /* --- OPEN FILE DIALOG --- */
        #file-picker-modal {
            display: none; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5); z-index: 200;
            align-items: center; justify-content: center;
        }
        
        .mac-dialog {
            width: 400px; background: #fff; border: 2px solid #000;
            box-shadow: 8px 8px 0 rgba(0,0,0,0.5); padding: 5px;
            display: flex; flex-direction: column;
        }

        .dialog-title {
            background: repeating-linear-gradient(to bottom, #000, #000 1px, #fff 1px, #fff 2px);
            height: 20px; text-align: center; margin-bottom: 10px;
        }
        .dialog-title span { background: #fff; padding: 0 5px; font-weight: bold; }

        #file-list-box {
            border: 2px solid #000; height: 200px; overflow-y: scroll;
            margin: 10px 20px; background: #fff;
        }
        
        .file-item { padding: 5px 10px; cursor: pointer; font-size: 20px; }
        .file-item:hover { text-decoration: underline; }
        .file-item.selected { background: #000; color: #fff; text-decoration: none; }

        .dialog-buttons {
            display: flex; justify-content: flex-end; padding: 10px 20px; gap: 10px;
        }
        
        .dialog-btn {
            border: 2px solid #000; background: #fff; font-family: 'VT323';
            font-size: 18px; padding: 5px 20px; cursor: pointer; box-shadow: 2px 2px 0 #000;
        }
        .dialog-btn:active { transform: translate(1px, 1px); box-shadow: 1px 1px 0 #000; }
        .dialog-btn.primary { border: 3px solid #000; font-weight: bold; }

        /* --- GAME UI ELEMENTS --- */
        #hud {
            width: 100%; display: flex; justify-content: space-between;
            border-bottom: 2px dashed #000; padding-bottom: 10px; margin-bottom: 10px;
            font-size: 24px; flex-shrink: 0;
        }

        .quiz-area {
            flex: 1; width: 100%; display: flex; flex-direction: column;
            justify-content: center; align-items: center; overflow-y: auto;
        }
        
        .prompt-text { font-size: 28px; margin-bottom: 20px; text-align: center; max-width: 800px; line-height: 1.2; }
        .main-display { font-size: 32px; font-weight: bold; margin-bottom: 30px; text-align: center; color: #444; max-width: 800px;}

        .options-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 15px;
            width: 100%; max-width: 600px;
        }

        .option-btn {
            background: #fff; border: 2px solid #000; padding: 12px;
            font-family: 'VT323', monospace; font-size: 24px; cursor: pointer;
            box-shadow: 4px 4px 0 #000; min-height: 60px; line-height: 1.1;
            display: flex; align-items: center; justify-content: center;
        }
        .option-btn:hover { background: #eee; }
        .option-btn.correct-anim { background: #000; color: #fff; }
        .option-btn.wrong-anim { opacity: 0.5; background: #aaa; text-decoration: line-through; }

        /* TRUE FALSE SPECIFIC */
        .tf-grid {
            display: flex; gap: 30px; justify-content: center; width: 100%;
        }
        .tf-btn {
            width: 150px; height: 100px; font-size: 32px; 
            background: #fff; border: 4px solid #000; box-shadow: 6px 6px 0 #000;
            cursor: pointer; font-family: 'VT323', monospace;
        }
        .tf-btn:active { transform: translate(3px, 3px); box-shadow: 3px 3px 0 #000; }

        /* TIMELINE STYLES */
        #timeline-list {
            display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 500px;
            overflow-y: auto; padding: 10px;
        }
        .timeline-item {
            border: 2px solid #000; padding: 10px; background: #fff;
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: 3px 3px 0 #ccc;
        }
        .timeline-item.correct { background: #444; color: #fff; border-color: #444; }
        .timeline-content { flex: 1; text-align: left; }
        .move-controls button {
            background: #fff; border: 1px solid #000; cursor: pointer; font-family: 'VT323';
            width: 30px; height: 30px; font-size: 20px;
        }

        /* MEMORY STYLES */
        #memory-grid {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;
            width: 100%; max-width: 700px; height: 100%; padding: 10px;
            overflow-y: auto;
        }
        .mem-card {
            background: #000; border: 2px solid #000; cursor: pointer;
            display: flex; align-items: center; justify-content: center; text-align: center;
            font-size: 20px; padding: 5px; color: transparent;
            transition: transform 0.1s; position: relative;
        }
        .mem-card.flipped { background: #fff; color: #000; }
        .mem-card.matched { visibility: hidden; pointer-events: none; }
        
        /* FEEDBACK BAR */
        #feedback-bar {
            margin-top: 10px; width: 100%; height: 40px; border: 2px solid #000;
            display: flex; align-items: center; justify-content: center; font-size: 24px;
            background: #eee; visibility: hidden; flex-shrink: 0;
        }
        #feedback-bar.visible { visibility: visible; }
        #feedback-bar.correct { background: #000; color: #fff; }
        #feedback-bar.wrong { background: repeating-linear-gradient(45deg, #fff, #fff 10px, #ccc 10px, #ccc 20px); color: #000; }

        /* REPORT CARD MODAL */
        #report-modal {
            display: none; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255,255,255,0.95); z-index: 100;
            flex-direction: column; justify-content: center; align-items: center;
        }
        #report-card { background: #fff; border: 4px double #000; padding: 40px; text-align: center; box-shadow: 10px 10px 0 rgba(0,0,0,0.2); }
        .shake-effect { animation: shake 0.5s; }
        @keyframes shake { 0% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } 100% { transform: translateX(0); } }
    </style>
</head>
<body>

    <div id="main-window">
        <div id="title-bar">
            <div id="close-btn" onclick="quitGame()"></div>
            <div id="title-text">MacStudy v1.3</div>
        </div>
        
        <div id="menu-bar">
            <div class="menu-item" onclick="openFilePicker()">FILE</div>
            <div class="menu-item" onclick="showHelp()">HELP</div>
        </div>

        <div id="content">

            <!-- MENU SCREEN -->
            <div id="menu-screen" class="screen active">
                <h1>MacStudy</h1>
                
                <h2 id="module-title" style="color: #666; font-style: italic;">NO MODULE LOADED</h2>
                <div style="text-align:center; font-size: 18px; margin-bottom: 10px;">Use FILE > OPEN to load a module</div>

                <div class="menu-grid">
                    <button id="btn-vocab" class="btn" disabled onclick="startGame('vocab')">VOCAB QUIZ</button>
                    <button id="btn-memory" class="btn" disabled onclick="startGame('memory')">MEMORY MATCH</button>
                    <button id="btn-timeline" class="btn" disabled onclick="startGame('timeline')">CHRONOLOGY</button>
                    <button id="btn-quiz" class="btn" disabled onclick="startGame('quiz')">KNOWLEDGE TEST</button>
                    <button id="btn-gallery" class="btn" disabled onclick="startGame('gallery')">THE GALLERY</button>
                    <button id="btn-passport" class="btn" disabled onclick="startGame('passport')">PASSPORT</button>
                    <button id="btn-tf" class="btn" disabled onclick="startGame('truefalse')">FACT OR FICTION</button>
                </div>
            </div>

            <!-- GAME SCREEN -->
            <div id="game-screen" class="screen">
                <div id="hud">
                    <span id="score-display">SCORE: 0</span>
                    <span id="mode-display">MODE</span>
                    <button style="font-family:'VT323'; background:none; border:1px solid #000; cursor:pointer;" onclick="quitGame()">QUIT</button>
                </div>

                <!-- GENERIC QUIZ UI (Used for Vocab, Quiz, Gallery, Passport) -->
                <div id="generic-quiz-ui" class="quiz-area" style="display:none;">
                    <div class="prompt-text" id="quiz-prompt">Prompt</div>
                    <div class="main-display" id="quiz-main">Main Item</div>
                    <div class="options-grid" id="quiz-options"></div>
                </div>

                <!-- TRUE FALSE UI -->
                <div id="tf-ui" class="quiz-area" style="display:none;">
                    <div class="prompt-text">FACT OR FICTION?</div>
                    <div class="main-display" id="tf-statement" style="min-height: 100px; display:flex; align-items:center;">Statement</div>
                    <div class="tf-grid">
                        <button class="tf-btn" id="btn-true" onclick="checkTF(true)">TRUE</button>
                        <button class="tf-btn" id="btn-false" onclick="checkTF(false)">FALSE</button>
                    </div>
                </div>

                <!-- TIMELINE UI -->
                <div id="timeline-ui" class="quiz-area" style="display:none;">
                    <div class="prompt-text">ORDER EVENTS (EARLIEST AT TOP)</div>
                    <div id="timeline-list"></div>
                    <button class="btn" style="margin-top:10px;" onclick="checkTimeline()">CHECK ORDER</button>
                </div>

                <!-- MEMORY UI -->
                <div id="memory-ui" class="quiz-area" style="display:none;">
                    <div id="memory-grid"></div>
                </div>

                <div id="feedback-bar"></div>
            </div>

            <!-- FILE PICKER MODAL -->
            <div id="file-picker-modal">
                <div class="mac-dialog">
                    <div class="dialog-title"><span>SELECT MODULE</span></div>
                    <div style="padding: 0 20px;">Select a file to open:</div>
                    <div id="file-list-box">
                        <div style="padding:10px; text-align:center;">Loading index...</div>
                    </div>
                    <div class="dialog-buttons">
                        <button class="dialog-btn" onclick="closeFilePicker()">Cancel</button>
                        <button class="dialog-btn primary" onclick="loadSelectedFile()">Open</button>
                    </div>
                </div>
            </div>

            <!-- REPORT MODAL -->
            <div id="report-modal">
                <div id="report-card">
                    <h2>REPORT CARD</h2>
                    <h1 id="report-percent" style="font-size:80px; margin: 10px 0;">100%</h1>
                    <p id="report-fraction">10 / 10 Correct</p>
                    <button class="btn" onclick="closeReport()">OK</button>
                </div>
            </div>

        </div>
    </div>

<script>
    // --- GLOBAL STATE ---
    const state = {
        module: null,
        gameMode: null,
        score: 0,
        pool: [],
        currentIdx: 0,
        testTotal: 0,
        testCorrect: 0,
        
        // File System
        availableModules: [],
        selectedFilename: null,

        // Quiz/Vocab
        currentOptions: [],

        // Memory
        flippedCards: [],
        matchesFound: 0,
        isLocked: false
    };

    // --- FILE SYSTEM ---
    async function openFilePicker() {
        document.getElementById('file-picker-modal').style.display = 'flex';
        const list = document.getElementById('file-list-box');
        
        try {
            const res = await fetch('modules.json?v=' + Date.now());
            if (!res.ok) throw new Error("Could not find modules.json");
            const data = await res.json();
            state.availableModules = data;
            renderFileList();
        } catch (e) {
            list.innerHTML = `<div style="padding:10px; color:red;">Error: modules.json not found.<br><br>Make sure modules.json exists in the same folder.</div>`;
        }
    }

    function renderFileList() {
        const list = document.getElementById('file-list-box');
        list.innerHTML = '';
        state.selectedFilename = null;

        state.availableModules.forEach(mod => {
            const div = document.createElement('div');
            div.className = 'file-item';
            div.innerText = mod.name;
            div.onclick = () => {
                document.querySelectorAll('.file-item').forEach(el => el.classList.remove('selected'));
                div.classList.add('selected');
                state.selectedFilename = mod.file;
            };
            list.appendChild(div);
        });
    }

    async function loadSelectedFile() {
        if (!state.selectedFilename) return;
        document.getElementById('file-picker-modal').style.display = 'none';
        
        try {
            const res = await fetch(state.selectedFilename + '?v=' + Date.now());
            if (!res.ok) throw new Error("File not found");
            const json = await res.json();
            loadModule(json);
        } catch (e) {
            alert("Error loading " + state.selectedFilename);
        }
    }

    function closeFilePicker() {
        document.getElementById('file-picker-modal').style.display = 'none';
    }

    function showHelp() {
        alert("MacStudy v1.3\n\n1. Create .json mod files.\n2. Add them to 'modules.json'.\n3. Use File > Open to play.");
    }

    function loadModule(data) {
        state.module = data;
        const info = data.moduleInfo || {};
        
        const titleDisplay = document.getElementById('module-title');
        titleDisplay.style.color = "#000";
        titleDisplay.style.fontStyle = "normal";
        titleDisplay.innerText = (info.title || "Untitled Module").toUpperCase();

        // Enable Buttons checks
        const hasVocab = data.vocabulary && data.vocabulary.length >= 4;
        document.getElementById('btn-vocab').disabled = !hasVocab;
        document.getElementById('btn-memory').disabled = !(data.vocabulary && data.vocabulary.length >= 2);
        document.getElementById('btn-timeline').disabled = !(data.timeline && data.timeline.length >= 3);
        document.getElementById('btn-quiz').disabled = !(data.quiz && data.quiz.length >= 1);
        
        // New Games Checks
        document.getElementById('btn-gallery').disabled = !(data.artworks && data.artworks.length >= 1);
        document.getElementById('btn-passport').disabled = !(data.locations && data.locations.length >= 1);
        document.getElementById('btn-tf').disabled = !(data.trueFalse && data.trueFalse.length >= 1);
    }

    // --- GAME ENGINE ---

    function showScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
    }

    function quitGame() {
        document.getElementById('report-modal').style.display = 'none';
        showScreen('menu-screen');
    }

    function startGame(mode) {
        state.gameMode = mode;
        state.score = 0;
        state.testTotal = 0;
        state.testCorrect = 0;
        state.currentIdx = 0;

        document.getElementById('score-display').innerText = "SCORE: 0";
        document.getElementById('mode-display').innerText = mode.toUpperCase();
        
        // Reset UIs
        document.getElementById('generic-quiz-ui').style.display = 'none';
        document.getElementById('timeline-ui').style.display = 'none';
        document.getElementById('memory-ui').style.display = 'none';
        document.getElementById('tf-ui').style.display = 'none';
        document.getElementById('feedback-bar').className = '';

        showScreen('game-screen');

        if (mode === 'vocab') startVocab();
        else if (mode === 'quiz') startQuiz();
        else if (mode === 'timeline') startTimeline();
        else if (mode === 'memory') startMemory();
        else if (mode === 'gallery') startGallery();
        else if (mode === 'passport') startPassport();
        else if (mode === 'truefalse') startTrueFalse();
    }

    // --- GENERIC QUIZ HANDLERS (Used by multiple modes) ---
    function checkGeneric(idx, isCorrect, correctText) {
        const btns = document.querySelectorAll('.option-btn');
        btns.forEach(b => b.disabled = true);
        const feedback = document.getElementById('feedback-bar');
        feedback.classList.add('visible');
        state.testTotal++;
        
        if (isCorrect) {
            btns[idx].classList.add('correct-anim');
            feedback.className = 'correct visible'; feedback.innerText = "CORRECT!";
            state.score += 10; state.testCorrect++;
            document.getElementById('score-display').innerText = "SCORE: " + state.score;
            setTimeout(() => {
                state.currentIdx++;
                nextRound();
            }, 1000);
        } else {
            btns[idx].classList.add('wrong-anim');
            feedback.className = 'wrong visible'; feedback.innerText = "WRONG. " + correctText;
            const win = document.getElementById('game-screen');
            void win.offsetWidth; win.classList.add('shake-effect');
            setTimeout(() => {
                win.classList.remove('shake-effect'); state.currentIdx++;
                nextRound();
            }, 2500);
        }
    }

    function nextRound() {
        if (state.gameMode === 'vocab') loadVocabRound();
        else if (state.gameMode === 'quiz') loadQuizRound();
        else if (state.gameMode === 'gallery') loadGalleryRound();
        else if (state.gameMode === 'passport') loadPassportRound();
        else if (state.gameMode === 'truefalse') loadTrueFalseRound();
    }

    // --- VOCAB ENGINE ---
    function startVocab() {
        state.pool = [...state.module.vocabulary].sort(() => 0.5 - Math.random()).slice(0, 10);
        document.getElementById('generic-quiz-ui').style.display = 'flex';
        loadVocabRound();
    }
    function loadVocabRound() {
        if (state.currentIdx >= state.pool.length) { showReport(); return; }
        const target = state.pool[state.currentIdx];
        const showTerm = Math.random() > 0.5;
        document.getElementById('quiz-prompt').innerText = showTerm ? "DEFINE THIS TERM:" : "IDENTIFY THE TERM:";
        document.getElementById('quiz-main').innerText = showTerm ? target.term.toUpperCase() : `"${target.definition}"`;
        let options = state.module.vocabulary.filter(v => v.term !== target.term).sort(() => 0.5 - Math.random()).slice(0, 3);
        options.push(target);
        state.currentOptions = options.sort(() => 0.5 - Math.random());
        renderOptions(state.currentOptions.map(o => ({ text: showTerm ? o.definition : o.term.toUpperCase(), isCorrect: o.term === target.term })), target.term + ": " + target.definition);
    }

    // --- QUIZ ENGINE ---
    function startQuiz() {
        state.pool = [...state.module.quiz].sort(() => 0.5 - Math.random()).slice(0, 10);
        document.getElementById('generic-quiz-ui').style.display = 'flex';
        loadQuizRound();
    }
    function loadQuizRound() {
        if (state.currentIdx >= state.pool.length) { showReport(); return; }
        const qData = state.pool[state.currentIdx];
        document.getElementById('quiz-prompt').innerText = "QUESTION:";
        document.getElementById('quiz-main').innerText = qData.question;
        const opts = qData.options.map(o => ({ text: o, isCorrect: o === qData.correctAnswer })).sort(() => 0.5 - Math.random());
        renderOptions(opts, qData.correctAnswer);
    }

    // --- GALLERY ENGINE (NEW) ---
    function startGallery() {
        state.pool = [...state.module.artworks].sort(() => 0.5 - Math.random());
        document.getElementById('generic-quiz-ui').style.display = 'flex';
        loadGalleryRound();
    }
    function loadGalleryRound() {
        if (state.currentIdx >= state.pool.length) { showReport(); return; }
        const item = state.pool[state.currentIdx];
        document.getElementById('quiz-prompt').innerText = "IDENTIFY THE WORK:";
        document.getElementById('quiz-main').innerText = `"${item.description}"`;
        // Distractors: other titles
        let options = state.module.artworks.filter(a => a.title !== item.title).sort(() => 0.5 - Math.random()).slice(0, 3);
        options.push(item);
        const finalOpts = options.sort(() => 0.5 - Math.random()).map(o => ({ text: o.title.toUpperCase(), isCorrect: o.title === item.title }));
        renderOptions(finalOpts, item.title);
    }

    // --- PASSPORT ENGINE (NEW) ---
    function startPassport() {
        state.pool = [...state.module.locations].sort(() => 0.5 - Math.random());
        document.getElementById('generic-quiz-ui').style.display = 'flex';
        loadPassportRound();
    }
    function loadPassportRound() {
        if (state.currentIdx >= state.pool.length) { showReport(); return; }
        const item = state.pool[state.currentIdx];
        document.getElementById('quiz-prompt').innerText = "WHERE AM I?";
        document.getElementById('quiz-main').innerText = `"${item.significance}"`;
        let options = state.module.locations.filter(a => a.name !== item.name).sort(() => 0.5 - Math.random()).slice(0, 3);
        options.push(item);
        const finalOpts = options.sort(() => 0.5 - Math.random()).map(o => ({ text: o.name.toUpperCase(), isCorrect: o.name === item.name }));
        renderOptions(finalOpts, item.name);
    }

    function renderOptions(optionsArray, correctTextForFeedback) {
        const grid = document.getElementById('quiz-options');
        grid.innerHTML = '';
        const fb = document.getElementById('feedback-bar');
        fb.className = ''; fb.classList.remove('visible');

        optionsArray.forEach((opt, idx) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt.text;
            btn.onclick = () => checkGeneric(idx, opt.isCorrect, correctTextForFeedback);
            if(btn.innerText.length > 50) btn.style.fontSize = "16px";
            grid.appendChild(btn);
        });
    }

    // --- TRUE/FALSE ENGINE (NEW) ---
    function startTrueFalse() {
        state.pool = [...state.module.trueFalse].sort(() => 0.5 - Math.random());
        document.getElementById('tf-ui').style.display = 'flex';
        loadTrueFalseRound();
    }
    function loadTrueFalseRound() {
        if (state.currentIdx >= state.pool.length) { showReport(); return; }
        const item = state.pool[state.currentIdx];
        document.getElementById('tf-statement').innerText = item.statement;
        
        document.getElementById('btn-true').className = 'tf-btn';
        document.getElementById('btn-false').className = 'tf-btn';
        document.getElementById('btn-true').disabled = false;
        document.getElementById('btn-false').disabled = false;
        
        const fb = document.getElementById('feedback-bar');
        fb.className = ''; fb.classList.remove('visible');
    }
    function checkTF(userSaysTrue) {
        const item = state.pool[state.currentIdx];
        const isCorrect = userSaysTrue === item.isTrue;
        
        document.getElementById('btn-true').disabled = true;
        document.getElementById('btn-false').disabled = true;
        
        const feedback = document.getElementById('feedback-bar');
        feedback.classList.add('visible');
        state.testTotal++;

        if (isCorrect) {
            feedback.className = 'correct visible'; feedback.innerText = "CORRECT!";
            state.score += 10; state.testCorrect++;
            document.getElementById('score-display').innerText = "SCORE: " + state.score;
            if(userSaysTrue) document.getElementById('btn-true').style.background = "#000"; 
            else document.getElementById('btn-false').style.background = "#000";
            if(userSaysTrue) document.getElementById('btn-true').style.color = "#fff"; 
            else document.getElementById('btn-false').style.color = "#fff";
            
            setTimeout(() => {
                state.currentIdx++; nextRound();
            }, 1000);
        } else {
            feedback.className = 'wrong visible'; 
            // Show correction if false, or support if true
            feedback.innerText = item.correction ? item.correction.toUpperCase() : "WRONG.";
            const win = document.getElementById('game-screen');
            void win.offsetWidth; win.classList.add('shake-effect');
            setTimeout(() => {
                win.classList.remove('shake-effect'); state.currentIdx++; nextRound();
            }, 3000);
        }
    }


    // --- TIMELINE & MEMORY (UNCHANGED) ---
    function startTimeline() {
        document.getElementById('timeline-ui').style.display = 'flex';
        state.pool = [...state.module.timeline].sort(() => 0.5 - Math.random()).slice(0, 5);
        renderTimeline();
        document.getElementById('feedback-bar').className = '';
    }
    function renderTimeline() {
        const list = document.getElementById('timeline-list');
        list.innerHTML = '';
        state.pool.forEach((item, idx) => {
            const row = document.createElement('div');
            row.className = 'timeline-item';
            row.innerHTML = `<div class="timeline-content">${item.event}</div><div class="move-controls"><button onclick="moveTimeline(${idx}, -1)">▲</button><button onclick="moveTimeline(${idx}, 1)">▼</button></div>`;
            list.appendChild(row);
        });
    }
    function moveTimeline(idx, dir) {
        const newIdx = idx + dir;
        if (newIdx < 0 || newIdx >= state.pool.length) return;
        [state.pool[idx], state.pool[newIdx]] = [state.pool[newIdx], state.pool[idx]];
        renderTimeline();
    }
    function checkTimeline() {
        const sorted = [...state.pool].sort((a,b) => a.year - b.year);
        let allCorrect = true;
        const rows = document.querySelectorAll('.timeline-item');
        state.pool.forEach((item, idx) => {
            const isPosCorrect = item.year === sorted[idx].year;
            rows[idx].querySelector('.timeline-content').innerText = `${item.year}: ${item.event}`;
            if (isPosCorrect) rows[idx].classList.add('correct'); else allCorrect = false;
        });
        const fb = document.getElementById('feedback-bar'); fb.classList.add('visible'); state.testTotal++;
        if (allCorrect) { fb.className = 'correct visible'; fb.innerText = "PERFECT ORDER!"; state.testCorrect++; state.score += 50; } 
        else { fb.className = 'wrong visible'; fb.innerText = "NOT QUITE..."; }
        document.getElementById('score-display').innerText = "SCORE: " + state.score;
        setTimeout(() => showReport(), 3000);
    }
    function startMemory() {
        document.getElementById('memory-ui').style.display = 'flex';
        state.flippedCards = []; state.matchesFound = 0; state.isLocked = false;
        const pairs = state.module.vocabulary.slice(0, 8); 
        let cards = [];
        pairs.forEach((item, i) => {
            cards.push({ id: i, type: 'term', text: item.term });
            cards.push({ id: i, type: 'def', text: item.definition });
        });
        cards.sort(() => 0.5 - Math.random());
        state.pool = cards;
        const grid = document.getElementById('memory-grid'); grid.innerHTML = '';
        cards.forEach((card, idx) => {
            const div = document.createElement('div'); div.className = 'mem-card'; div.innerText = card.text; div.dataset.idx = idx;
            div.onclick = () => flipCard(div, card);
            if (card.text.length > 50) div.style.fontSize = "12px"; else if (card.text.length > 20) div.style.fontSize = "16px";
            grid.appendChild(div);
        });
        state.testTotal = pairs.length;
    }
    function flipCard(el, cardData) {
        if (state.isLocked || el.classList.contains('flipped') || el.classList.contains('matched')) return;
        el.classList.add('flipped'); state.flippedCards.push({ el, data: cardData });
        if (state.flippedCards.length === 2) checkForMatch();
    }
    function checkForMatch() {
        state.isLocked = true;
        const [c1, c2] = state.flippedCards;
        const isMatch = (c1.data.id === c2.data.id);
        const fb = document.getElementById('feedback-bar');
        if (isMatch) {
            fb.className = 'correct visible'; fb.innerText = "MATCH FOUND!"; state.score += 10; state.matchesFound++;
            document.getElementById('score-display').innerText = "SCORE: " + state.score;
            setTimeout(() => { c1.el.classList.add('matched'); c2.el.classList.add('matched'); state.flippedCards = []; state.isLocked = false; fb.className = ''; if (state.matchesFound === state.testTotal) { state.testCorrect = state.testTotal; showReport(); } }, 1000);
        } else {
            fb.className = 'wrong visible'; fb.innerText = "NO MATCH";
            setTimeout(() => { c1.el.classList.remove('flipped'); c2.el.classList.remove('flipped'); state.flippedCards = []; state.isLocked = false; fb.className = ''; }, 1500);
        }
    }

    function showReport() {
        let pct = state.testTotal === 0 ? 0 : Math.round((state.testCorrect / state.testTotal) * 100);
        if (state.gameMode === 'timeline') pct = state.testCorrect > 0 ? 100 : 0;
        document.getElementById('report-percent').innerText = pct + "%";
        document.getElementById('report-fraction').innerText = `${state.testCorrect} / ${state.testTotal} Correct`;
        document.getElementById('report-modal').style.display = 'flex';
    }
    function closeReport() { document.getElementById('report-modal').style.display = 'none'; quitGame(); }
</script>
