<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Learning Garden</title>
    
    <!-- Fonts: Quicksand for that organic, friendly Reggio feel -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Phosphor Icons (Clean, organic icons) -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        reggio: {
                            cream: '#F9F7F2',
                            sage: '#9EB298',
                            darkSage: '#768A72',
                            clay: '#C89F91',
                            wood: '#BCA88E',
                            stone: '#5C5C5C',
                            paper: '#FFFDF5'
                        }
                    },
                    fontFamily: {
                        sans: ['Quicksand', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        /* Custom Animations */
        body { background-color: #F9F7F2; background-image: radial-gradient(#E5E5E5 1px, transparent 1px); background-size: 20px 20px; }
        
        .card-hover { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .card-hover:hover { transform: translateY(-4px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
        .card-active { transform: scale(0.98); }
        
        /* Flip Card Effect */
        .perspective-1000 { perspective: 1000px; }
        .transform-style-3d { transform-style: preserve-3d; }
        .backface-hidden { backface-visibility: hidden; }
        .rotate-y-180 { transform: rotateY(180deg); }

        /* Gentle Pulse for Hints */
        @keyframes gentle-pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.05); }
        }
        .animate-gentle-pulse { animation: gentle-pulse 2s infinite; }

        /* Floating particles */
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        .floating { animation: float 6s ease-in-out infinite; }
    </style>
</head>
<body class="text-reggio-stone overflow-hidden h-screen w-full select-none">

    <!-- ========================================== -->
    <!-- TEACHER CONFIGURATION SECTION -->
    <!-- Edit values inside this script block -->
    <!-- ========================================== -->
    <script>
        const TEACHER_SETTINGS = {
            // General Game Settings
            startingLives: 5,           // Number of hearts to start with
            pointsPerCorrect: 10,       // Points earned for a correct answer
            pointsPenalty: 2,           // Points lost for a wrong answer
            hintsAllowed: 3,            // Number of hints allowed per session
            
            // Difficulty Adjustments
            passingScorePercent: 70,    // Percent needed to "Master" a module
            animationSpeed: 1000,       // Speed of transitions in milliseconds
            
            // Text & Labels
            appTitle: "The Learning Garden",
            welcomeMessage: "Welcome, 4th Graders! Choose a path to explore.",
            
            // Audio Settings
            soundEnabled: true,         // Set to false to mute all sounds by default
        };
    </script>
    <!-- ========================================== -->
    <!-- END TEACHER CONFIGURATION -->
    <!-- ========================================== -->

    <!-- AUDIO SYSTEM (Synthesized, no external files needed) -->
    <script>
        const AudioSys = {
            ctx: new (window.AudioContext || window.webkitAudioContext)(),
            playTone: function(freq, type, duration) {
                if (!TEACHER_SETTINGS.soundEnabled) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = type;
                osc.frequency.value = freq;
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                gain.gain.exponentialRampToValueAtTime(0.00001, this.ctx.currentTime + duration);
                osc.stop(this.ctx.currentTime + duration);
            },
            playCorrect: function() {
                this.playTone(600, 'sine', 0.1);
                setTimeout(() => this.playTone(900, 'sine', 0.4), 100);
            },
            playWrong: function() {
                this.playTone(200, 'triangle', 0.3);
            },
            playClick: function() {
                this.playTone(400, 'sine', 0.05);
            },
            playWin: function() {
                let note = 400;
                for(let i=0; i<5; i++) {
                    setTimeout(() => this.playTone(note + (i*100), 'sine', 0.2), i*150);
                }
            }
        };
    </script>

    <!-- APP CONTAINER -->
    <div id="app" class="h-full w-full flex flex-col relative">
        
        <!-- HEADER -->
        <header class="h-16 bg-white shadow-sm flex items-center justify-between px-6 z-20 border-b border-reggio-sage/20">
            <div class="flex items-center gap-3">
                <i class="ph ph-potted-plant text-3xl text-reggio-darkSage"></i>
                <h1 class="text-xl font-bold tracking-tight text-reggio-darkSage" id="header-title">Loading...</h1>
            </div>
            
            <div class="flex items-center gap-4">
                <!-- Stats Display (Hidden on menu) -->
                <div id="game-stats" class="hidden flex items-center gap-4 bg-reggio-cream px-4 py-1 rounded-full border border-reggio-sage/30">
                    <div class="flex items-center gap-1 text-reggio-clay font-bold">
                        <i class="ph-fill ph-heart text-red-400"></i>
                        <span id="lives-display">5</span>
                    </div>
                    <div class="flex items-center gap-1 text-reggio-darkSage font-bold">
                        <i class="ph-fill ph-star text-yellow-500"></i>
                        <span id="score-display">0</span>
                    </div>
                </div>
                
                <button onclick="App.toggleSettings()" class="text-reggio-stone hover:text-reggio-darkSage transition-colors">
                    <i class="ph ph-gear text-2xl"></i>
                </button>
            </div>
        </header>

        <!-- MAIN CONTENT AREA -->
        <main class="flex-1 overflow-hidden relative flex flex-col items-center justify-center p-4">
            
            <!-- VIEW: SPLASH / MENU -->
            <div id="view-menu" class="w-full max-w-5xl h-full flex flex-col animate-fade-in">
                <div class="text-center py-8">
                    <h2 class="text-3xl text-reggio-darkSage font-bold mb-2" id="welcome-msg"></h2>
                    <p class="text-reggio-stone/70">Select a module to begin your journey.</p>
                </div>
                
                <div id="module-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 overflow-y-auto pb-20 px-4">
                    <!-- Modules injected here -->
                </div>
            </div>

            <!-- VIEW: GAME -->
            <div id="view-game" class="hidden w-full max-w-3xl flex-col items-center h-full pt-4">
                
                <!-- Progress Bar -->
                <div class="w-full h-3 bg-gray-200 rounded-full mb-6 overflow-hidden">
                    <div id="progress-fill" class="h-full bg-reggio-sage transition-all duration-500" style="width: 0%"></div>
                </div>

                <!-- Card Container -->
                <div class="w-full flex-1 flex flex-col items-center justify-center relative">
                    
                    <!-- Question Card -->
                    <div id="card-container" class="bg-white w-full shadow-xl rounded-2xl p-8 border-b-4 border-reggio-sage/20 relative min-h-[300px] flex flex-col items-center justify-center text-center floating">
                        <!-- Hint Button -->
                        <button id="hint-btn" onclick="Game.useHint()" class="absolute top-4 right-4 text-reggio-clay hover:text-reggio-darkSage transition-colors flex items-center gap-1 text-sm font-bold">
                            <i class="ph ph-lightbulb text-xl"></i>
                            <span id="hints-left">3</span>
                        </button>

                        <span id="q-category" class="uppercase tracking-widest text-xs font-bold text-reggio-sage mb-4">Vocabulary</span>
                        <h2 id="q-text" class="text-3xl md:text-4xl font-medium text-reggio-stone mb-6">Question Text</h2>
                        
                        <!-- Feedback Overlay -->
                        <div id="feedback-overlay" class="absolute inset-0 rounded-2xl flex items-center justify-center bg-white/95 z-10 hidden opacity-0 transition-opacity duration-300">
                            <div class="text-center">
                                <i id="fb-icon" class="ph-fill ph-check-circle text-6xl text-green-500 mb-2 block"></i>
                                <h3 id="fb-text" class="text-2xl font-bold">Correct!</h3>
                            </div>
                        </div>
                    </div>

                    <!-- Options Grid -->
                    <div id="options-grid" class="grid grid-cols-1 md:grid-cols-2 gap-4 w-full mt-8">
                        <!-- Options injected here -->
                    </div>

                </div>
                
                <button onclick="App.showMenu()" class="mt-6 mb-2 text-reggio-stone/50 hover:text-reggio-stone text-sm flex items-center gap-2">
                    <i class="ph ph-arrow-left"></i> Return to Garden
                </button>
            </div>

        </main>

        <!-- SETTINGS MODAL -->
        <div id="settings-modal" class="hidden fixed inset-0 bg-black/20 backdrop-blur-sm z-50 items-center justify-center">
            <div class="bg-white rounded-2xl shadow-2xl p-6 w-full max-w-md mx-4">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-xl font-bold text-reggio-darkSage">Settings</h3>
                    <button onclick="App.toggleSettings()" class="text-gray-400 hover:text-gray-600"><i class="ph ph-x text-xl"></i></button>
                </div>
                
                <div class="space-y-4">
                    <div class="p-4 bg-reggio-cream rounded-lg border border-reggio-sage/20">
                        <h4 class="font-bold text-sm uppercase text-reggio-stone mb-2">My Progress</h4>
                        <div class="flex justify-between items-center">
                            <span>Total Score:</span>
                            <span class="font-bold text-reggio-darkSage" id="total-score-display">0</span>
                        </div>
                    </div>

                    <div class="pt-4 border-t">
                        <h4 class="font-bold text-sm uppercase text-red-400 mb-2">Danger Zone</h4>
                        <p class="text-xs text-gray-500 mb-3">Clear all progress and badges. This cannot be undone.</p>
                        <button onclick="App.resetProgress()" class="w-full py-2 bg-red-50 text-red-500 hover:bg-red-100 rounded-lg font-bold text-sm transition-colors">
                            Reset All Progress
                        </button>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- LOGIC -->
    <script>
        // --- STATE MANAGEMENT ---
        const App = {
            modules: [],
            currentModule: null,
            
            init: async function() {
                // Apply Teacher Settings
                document.getElementById('header-title').innerText = TEACHER_SETTINGS.appTitle;
                document.getElementById('welcome-msg').innerText = TEACHER_SETTINGS.welcomeMessage;
                
                this.loadProgress();
                await this.fetchModules();
                
                // Audio Context unlock for browsers
                document.body.addEventListener('click', () => {
                    if (AudioSys.ctx.state === 'suspended') AudioSys.ctx.resume();
                }, {once:true});
            },

            fetchModules: async function() {
                try {
                    const response = await fetch('modules.json');
                    if (!response.ok) throw new Error("Couldn't find modules.json");
                    this.modules = await response.json();
                    this.renderMenu();
                } catch (e) {
                    console.error(e);
                    document.getElementById('module-grid').innerHTML = `
                        <div class="col-span-full text-center p-8 bg-red-50 rounded-xl text-red-500">
                            <i class="ph ph-warning-circle text-4xl mb-2"></i>
                            <p>Could not load learning modules. Please ensure 'modules.json' is in the same folder.</p>
                        </div>`;
                }
            },

            renderMenu: function() {
                const grid = document.getElementById('module-grid');
                grid.innerHTML = '';
                
                this.modules.forEach(mod => {
                    const savedData = this.getProgress(mod.file);
                    const isMastered = savedData && savedData.bestScore >= 100; // Simplified mastery logic
                    
                    const card = document.createElement('div');
                    card.className = `bg-white rounded-xl p-6 shadow-sm border border-reggio-wood/20 cursor-pointer card-hover relative overflow-hidden group`;
                    card.onclick = () => this.startModule(mod);
                    
                    let badgeHTML = isMastered 
                        ? `<div class="absolute top-2 right-2 text-yellow-400 drop-shadow-sm"><i class="ph-fill ph-medal text-2xl"></i></div>` 
                        : '';

                    card.innerHTML = `
                        ${badgeHTML}
                        <div class="w-12 h-12 rounded-full bg-reggio-cream flex items-center justify-center mb-4 text-reggio-sage group-hover:bg-reggio-sage group-hover:text-white transition-colors">
                            <i class="ph-fill ph-book-open text-2xl"></i>
                        </div>
                        <h3 class="font-bold text-lg text-reggio-stone mb-1">${mod.name}</h3>
                        <p class="text-sm text-gray-500">Tap to start</p>
                        ${savedData ? `<div class="mt-4 text-xs font-mono text-gray-400">Best: ${savedData.score} pts</div>` : ''}
                    `;
                    grid.appendChild(card);
                });
            },

            startModule: async function(moduleObj) {
                try {
                    const res = await fetch(moduleObj.file);
                    if(!res.ok) throw new Error('File not found');
                    const data = await res.json();
                    
                    // Normalize data (handle both 'quiz' arrays and 'vocabulary' arrays)
                    let questions = [];
                    
                    // If it has a quiz section, use that
                    if (data.quiz && Array.isArray(data.quiz)) {
                        questions = data.quiz.map(q => ({
                            type: 'quiz',
                            prompt: q.question,
                            options: q.options, // Assumes options are strings
                            answer: q.correctAnswer,
                            hint: "Think carefully!" // Default hint if none provided
                        }));
                    } 
                    // If it has vocabulary, generate questions
                    else if (data.vocabulary && Array.isArray(data.vocabulary)) {
                        questions = data.vocabulary.map(v => {
                            // Generate 3 random wrong answers from other vocab words
                            const otherTerms = data.vocabulary.filter(t => t.term !== v.term);
                            const wrongOptions = otherTerms.sort(() => 0.5 - Math.random()).slice(0, 3).map(t => t.definition);
                            const options = [...wrongOptions, v.definition].sort(() => 0.5 - Math.random());
                            
                            return {
                                type: 'vocab',
                                prompt: `What does <span class="text-reggio-darkSage font-bold">"${v.term}"</span> mean?`,
                                options: options,
                                answer: v.definition,
                                hint: v.partOfSpeech ? `It is a ${v.partOfSpeech}.` : "Recall the flashcards."
                            };
                        });
                    }

                    if (questions.length === 0) throw new Error("No questions found in file.");

                    Game.start(questions, moduleObj.file);
                    
                    // UI Switch
                    document.getElementById('view-menu').classList.add('hidden');
                    document.getElementById('view-game').classList.remove('hidden');
                    document.getElementById('view-game').classList.add('flex');
                    document.getElementById('game-stats').classList.remove('hidden');
                    document.getElementById('header-title').innerText = moduleObj.name;

                } catch (e) {
                    alert("Error loading module: " + e.message);
                }
            },

            showMenu: function() {
                Game.stop();
                document.getElementById('view-game').classList.add('hidden');
                document.getElementById('view-game').classList.remove('flex');
                document.getElementById('view-menu').classList.remove('hidden');
                document.getElementById('game-stats').classList.add('hidden');
                document.getElementById('header-title').innerText = TEACHER_SETTINGS.appTitle;
                this.renderMenu(); // Refresh to show scores
            },

            toggleSettings: function() {
                const modal = document.getElementById('settings-modal');
                const isHidden = modal.classList.contains('hidden');
                if(isHidden) {
                    modal.classList.remove('hidden');
                    modal.classList.add('flex');
                    // Update total score
                    const total = Object.values(this.progress).reduce((acc, curr) => acc + (curr.score || 0), 0);
                    document.getElementById('total-score-display').innerText = total;
                } else {
                    modal.classList.add('hidden');
                    modal.classList.remove('flex');
                }
            },

            // --- LOCAL STORAGE ---
            progress: {},
            loadProgress: function() {
                const stored = localStorage.getItem('reggioApp_progress');
                if (stored) this.progress = JSON.parse(stored);
            },
            saveProgress: function(filename, score, completed) {
                if (!this.progress[filename]) this.progress[filename] = { score: 0, bestScore: 0 };
                
                // Add cumulative score
                this.progress[filename].score = (this.progress[filename].score || 0) + score;
                
                // Track mastery (pseudo percentage based on completion)
                if (completed) this.progress[filename].bestScore = 100;
                
                localStorage.setItem('reggioApp_progress', JSON.stringify(this.progress));
            },
            getProgress: function(filename) {
                return this.progress[filename];
            },
            resetProgress: function() {
                if(confirm("Are you sure you want to erase all history?")) {
                    localStorage.removeItem('reggioApp_progress');
                    this.progress = {};
                    location.reload();
                }
            }
        };

        // --- GAME ENGINE ---
        const Game = {
            questions: [],
            currentQIndex: 0,
            score: 0,
            lives: 0,
            hints: 0,
            currentFilename: '',
            
            start: function(questions, filename) {
                this.questions = questions.sort(() => 0.5 - Math.random()); // Shuffle
                this.currentFilename = filename;
                this.currentQIndex = 0;
                this.score = 0;
                this.lives = TEACHER_SETTINGS.startingLives;
                this.hints = TEACHER_SETTINGS.hintsAllowed;
                this.updateStats();
                this.renderQuestion();
            },

            stop: function() {
                this.questions = [];
            },

            renderQuestion: function() {
                if (this.currentQIndex >= this.questions.length) {
                    this.endGame(true);
                    return;
                }

                const q = this.questions[this.currentQIndex];
                
                // UI Updates
                document.getElementById('q-category').innerText = q.type === 'vocab' ? 'Translation' : 'Quiz';
                document.getElementById('q-text').innerHTML = q.prompt;
                document.getElementById('hints-left').innerText = this.hints;
                document.getElementById('hint-btn').classList.remove('opacity-50', 'cursor-not-allowed');
                
                // Progress Bar
                const pct = (this.currentQIndex / this.questions.length) * 100;
                document.getElementById('progress-fill').style.width = `${pct}%`;

                // Render Options
                const grid = document.getElementById('options-grid');
                grid.innerHTML = '';
                
                q.options.forEach(opt => {
                    const btn = document.createElement('button');
                    btn.className = `w-full p-4 bg-white border-2 border-reggio-wood/20 rounded-xl text-lg font-medium text-reggio-stone hover:bg-reggio-cream hover:border-reggio-sage transition-all active:scale-95 shadow-sm text-left`;
                    btn.innerText = opt;
                    btn.onclick = (e) => this.handleAnswer(opt, q.answer, e.target);
                    grid.appendChild(btn);
                });

                // Hide feedback
                const fb = document.getElementById('feedback-overlay');
                fb.classList.add('hidden');
                fb.classList.remove('opacity-100');
                fb.classList.add('opacity-0');
            },

            handleAnswer: function(selected, correct, btnElement) {
                if (document.getElementById('feedback-overlay').classList.contains('opacity-100')) return; // Prevent double clicking

                const isCorrect = selected === correct;
                
                if (isCorrect) {
                    AudioSys.playCorrect();
                    this.score += TEACHER_SETTINGS.pointsPerCorrect;
                    this.showFeedback(true);
                    setTimeout(() => {
                        this.currentQIndex++;
                        this.renderQuestion();
                    }, TEACHER_SETTINGS.animationSpeed);
                } else {
                    AudioSys.playWrong();
                    this.score = Math.max(0, this.score - TEACHER_SETTINGS.pointsPenalty);
                    this.lives--;
                    
                    btnElement.classList.add('bg-red-50', 'border-red-300');
                    btnElement.classList.add('shake-anim'); // We'd need to define this CSS, keeping it simple for now
                    
                    this.updateStats();
                    
                    if (this.lives <= 0) {
                        this.endGame(false);
                    }
                }
                this.updateStats();
            },

            useHint: function() {
                if (this.hints <= 0) return;
                
                const q = this.questions[this.currentQIndex];
                const grid = document.getElementById('options-grid');
                const buttons = Array.from(grid.children);
                
                // Find wrong answers that haven't been disabled yet
                const wrongButtons = buttons.filter(btn => btn.innerText !== q.answer && !btn.disabled);
                
                if (wrongButtons.length > 0) {
                    // Disable/Hide one wrong answer
                    const toRemove = wrongButtons[Math.floor(Math.random() * wrongButtons.length)];
                    toRemove.style.opacity = '0.3';
                    toRemove.disabled = true;
                    this.hints--;
                    AudioSys.playClick();
                    document.getElementById('hints-left').innerText = this.hints;
                    
                    if(this.hints === 0) {
                        document.getElementById('hint-btn').classList.add('opacity-50', 'cursor-not-allowed');
                    }
                }
            },

            showFeedback: function(isCorrect) {
                const fb = document.getElementById('feedback-overlay');
                const icon = document.getElementById('fb-icon');
                const text = document.getElementById('fb-text');
                
                fb.classList.remove('hidden');
                // Trigger reflow
                void fb.offsetWidth;
                fb.classList.remove('opacity-0');
                fb.classList.add('opacity-100');
                
                if (isCorrect) {
                    icon.className = 'ph-fill ph-check-circle text-6xl text-reggio-sage mb-2 block animate-bounce';
                    text.innerText = "Excellent!";
                    text.className = "text-2xl font-bold text-reggio-darkSage";
                }
            },

            updateStats: function() {
                document.getElementById('score-display').innerText = this.score;
                document.getElementById('lives-display').innerText = this.lives;
            },

            endGame: function(won) {
                const overlay = document.getElementById('feedback-overlay');
                overlay.classList.remove('hidden', 'opacity-0');
                overlay.classList.add('opacity-100');
                overlay.innerHTML = `
                    <div class="text-center p-8">
                        <i class="ph-fill ${won ? 'ph-trophy' : 'ph-smiley-sad'} text-6xl ${won ? 'text-yellow-400' : 'text-gray-400'} mb-4"></i>
                        <h2 class="text-3xl font-bold mb-2 text-reggio-stone">${won ? 'Module Complete!' : 'Try Again'}</h2>
                        <p class="mb-6 text-lg">Final Score: <span class="font-bold text-reggio-darkSage">${this.score}</span></p>
                        <button onclick="App.showMenu()" class="px-6 py-3 bg-reggio-sage text-white rounded-full font-bold hover:bg-reggio-darkSage transition-colors shadow-lg">
                            Return to Garden
                        </button>
                    </div>
                `;

                if (won) {
                    AudioSys.playWin();
                    confetti({
                        particleCount: 100,
                        spread: 70,
                        origin: { y: 0.6 },
                        colors: ['#9EB298', '#C89F91', '#F9F7F2']
                    });
                    App.saveProgress(this.currentFilename, this.score, true);
                }
            }
        };

        // Start the app
        window.onload = () => App.init();

    </script>
</body>
</html>
